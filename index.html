<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jungla Lab · CRM</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee;--surface:#fbfaf6;--surface2:#eeebe3;--line:#ddd8cc;--line2:#e8e4da;
  --ink:#1e231f;--ink2:#555c55;--ink3:#80867c;
  --accent:#2f6b4f;--accent-ink:#fbfaf6;
  --lead:#2f63a8;--mql:#c08f12;--sql:#b8432e;--venta:#2f7a50;--proy:#6a4f9c;--lost:#8a8578;
  --ok:#2f7a50;--warn:#a87a0c;--crit:#b3261e;--info:#2f63a8;
  --shadow:0 10px 30px rgba(40,36,24,.14);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#151815;--surface:#1c201c;--surface2:#262b26;--line:#343b34;--line2:#2b312b;
  --ink:#ebeae3;--ink2:#a8ada3;--ink3:#7f857a;
  --accent:#6fb58f;--accent-ink:#10140f;
  --lead:#5b8fd6;--mql:#ae8420;--sql:#e2575a;--venta:#4fa274;--proy:#9474d0;--lost:#8f8b80;
  --ok:#6fb58f;--warn:#e0b04a;--crit:#f07466;--info:#7ea9dc;--shadow:0 10px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151815;--surface:#1c201c;--surface2:#262b26;--line:#343b34;--line2:#2b312b;
  --ink:#ebeae3;--ink2:#a8ada3;--ink3:#7f857a;
  --accent:#6fb58f;--accent-ink:#10140f;
  --lead:#5b8fd6;--mql:#ae8420;--sql:#e2575a;--venta:#4fa274;--proy:#9474d0;--lost:#8f8b80;
  --ok:#6fb58f;--warn:#e0b04a;--crit:#f07466;--info:#7ea9dc;--shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:16px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.navlist{display:flex;flex-direction:column;gap:2px}
.navsep{height:1px;background:var(--line);margin:8px 6px}
.navbtn{display:flex;align-items:center;gap:10px;justify-content:space-between;width:100%;background:none;border:0;border-radius:7px;padding:8px 10px;text-align:left;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
.navbtn:hover{background:var(--surface2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.navbtn .cnt{font:500 11px var(--mono);opacity:.75}
.navbtn .cnt.alert{color:var(--crit);opacity:1}
.navbtn[aria-current="page"] .cnt.alert{color:var(--accent-ink)}
.side-foot{margin-top:auto;padding:10px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--ink2)}
.side-foot b{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink3);display:block;margin-bottom:3px}

.main{padding-inline:28px;padding-block:26px 60px;display:flex;flex-direction:column;gap:20px;min-width:0}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.pagehead h1{font-size:30px;line-height:1.1}
.eyebrow{margin:0 0 6px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.meta{margin:0;color:var(--ink3);font-size:12px}
.rules{display:flex;flex-wrap:wrap;gap:6px}
.rule{font:12px var(--mono);color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:-6px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px 9px;margin-bottom:-1px;cursor:pointer;color:var(--ink2);font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .lab{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.kpi .val{font:500 23px/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .foot{font-size:11.5px;color:var(--ink2)}
.sim{font:10px var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;letter-spacing:.04em}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;flex-wrap:wrap}
.panel-h h2{font-size:18px}
.panel-h p{margin:0;font-size:12px;color:var(--ink3)}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.funnel{display:grid;grid-template-columns:132px 1fr 1fr;gap:8px 14px;align-items:center}
.funnel .fh{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.funnel .fl{font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.funnel .fl i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.bar{position:relative;height:22px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.85;border-radius:0 4px 4px 0}
.bar.v b{opacity:.35}
.bar span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font:500 12px var(--mono);color:var(--ink)}

/* charts */
.hb{display:flex;flex-direction:column;gap:7px}
.hb-row{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.hb-t{position:relative;height:14px;background:var(--surface2);border-radius:0 4px 4px 0}
.hb-t b{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;max-width:100%}
.hb-t i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px;box-shadow:0 0 0 2px var(--surface)}
.hb-v{font-size:12px;color:var(--ink);white-space:nowrap;text-align:right;min-width:56px}
.vb svg{width:100%;height:auto;display:block}
.vb .ax{fill:var(--ink3);font:11px var(--mono)}
.vb .axv{fill:var(--ink);font:500 11px var(--mono)}
.vb .grid{stroke:var(--line2);stroke-width:1}
.vb .base{stroke:var(--line);stroke-width:1}
.chart-note{font-size:11.5px;color:var(--ink3);margin:0}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);font:12px var(--mono);padding:5px 8px;border-radius:6px;max-width:280px;box-shadow:var(--shadow)}

.feed,.cps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line2)}
.feed li:first-child{border-top:0}
.feed .when{font:11.5px var(--mono);color:var(--ink3);padding-top:2px}
.feed .ag{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--ink2);margin-bottom:2px}
.feed .ag::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c)}
.feed p{margin:0;font-size:13px}
.cps li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line2)}
.cps li:first-child{border-top:0}
.cps .ct{display:flex;flex-direction:column;gap:2px;min-width:0}
.cps .ct b{font-weight:600;font-size:13px}
.cps .ct span{font-size:12px;color:var(--ink2)}

.pill{--c:var(--ink3);display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--mono);color:var(--ink);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill.plain::before{display:none}
.ph-lead{--c:var(--lead)}.ph-mql{--c:var(--mql)}.ph-sql{--c:var(--sql)}.ph-venta{--c:var(--venta)}.ph-proy{--c:var(--proy)}.ph-lost{--c:var(--lost)}
.chip{--c:var(--ink3);display:inline-flex;align-items:center;gap:5px;font:500 11px var(--mono);color:var(--ink);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:4px;padding:2px 6px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.ok{--c:var(--ok)}.chip.warn{--c:var(--warn)}.chip.crit{--c:var(--crit)}.chip.info{--c:var(--info)}.chip.mute{--c:var(--ink3)}
.test{font:500 9.5px var(--mono);letter-spacing:.08em;color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:0 4px;line-height:15px;flex:none}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:6px 12px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:2px;text-align:left}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select,.fld select,.fld input,.np input,.np select,.cfg input,.cfg select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-width:0}
.filters input[type=search]{width:min(280px,100%)}
.filters label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.count{font:12px var(--mono);color:var(--ink3);margin-left:auto}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 262px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 250px);min-height:200px;transition:border-color .15s}
.col.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface2))}
.colhead{--c:var(--ink3);padding:11px 12px 9px;border-bottom:2px solid var(--c);display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center}
.colhead .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.colhead h3{font:600 13px var(--sans);letter-spacing:0}
.colhead .n{font-size:12px;color:var(--ink2)}
.colhead .colmeta{grid-column:2/4;font-size:11px;color:var(--ink3)}
.colbody{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:grab;transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow)}
.card.dragging{opacity:.45}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-top strong{font-size:13px;line-height:1.3}
.card-sub{font-size:12px;color:var(--ink2)}
.card-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-row .val{font-weight:500;font-size:13px}
.score{font:500 11px var(--mono);border-radius:4px;padding:1px 6px;background:var(--surface2);color:var(--ink2)}
.score.hi{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ink)}
.card-next{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:6px}
.card-next .mono{color:var(--ink3);flex:none}
.card-next .late{color:var(--crit)}
.alerts{display:flex;flex-wrap:wrap;gap:4px}
.empty{color:var(--ink3);font-size:12px;text-align:center;margin:18px 0}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--surface2)}
.tbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .nm{font-weight:500}
.tbl .sm{font-size:12px;color:var(--ink2)}
.panel .tblwrap{border-radius:8px}
.nowrap{white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .lab{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.stat .val{font:500 20px var(--mono);margin-top:3px}
.stat .foot{font-size:11.5px;color:var(--ink2);margin-top:2px}
.ladder{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--ink2)}

.pboard{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.pcol{background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px}
.pcol h3{font:600 13px var(--sans);padding:4px 4px 6px;border-bottom:2px solid var(--proy);display:flex;justify-content:space-between}
.pcard{cursor:pointer}
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--proy)}
.sem{display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--mono)}
.sem i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
.sem.g{--c:var(--ok)}.sem.a{--c:var(--warn)}.sem.r{--c:var(--crit)}
.riskflag{font-size:12px;color:var(--crit);display:flex;flex-direction:column;gap:2px;border-top:1px dashed var(--line);padding-top:6px}
.riskflag b{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* configuración */
.cfggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.cfg{display:flex;flex-direction:column;gap:0}
.cfg-row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}
.cfg-row:first-child{border-top:0}
.cfg-row b{display:block;font-weight:500;font-size:13px}
.cfg-row span{display:block;font-size:12px;color:var(--ink2)}
.cfg-row input[type=number]{width:100%;text-align:right;font-family:var(--mono)}
.cfg-row input[type=url]{width:100%;font:12px var(--mono)}
a.btn{text-decoration:none}a.link{font-size:12.5px;white-space:nowrap}
.dsec .gate h3{margin:0}
.cfg-row .unit{font:11px var(--mono);color:var(--ink3);text-align:right}
.sw{display:flex;justify-content:flex-end}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.integ{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}
.integ:first-child{border-top:0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,22,18,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:31;overflow-y:auto;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{padding:20px 22px 14px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
.dh-top{display:flex;gap:8px;align-items:center}
.dh-top .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink2)}
.dh h2{font-size:22px;margin-top:10px}
.dh-sub{margin:4px 0 0;color:var(--ink2);font-size:13px}
.dsec{padding:16px 22px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.dsec h3{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px;margin:0}
.facts div{display:flex;flex-direction:column;gap:1px;min-width:0}
.facts dt{font:10.5px var(--mono);color:var(--ink3);letter-spacing:.04em}
.facts dd{margin:0;font-size:13px;font-weight:500;overflow-wrap:anywhere}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.stagebar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.bant{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bk{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.bk.on{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.bk input{accent-color:var(--accent);margin:0}
.bk .bl{font-weight:600;color:var(--accent)}
.bk .pts{font-size:11px;color:var(--ink3)}
.gates{display:flex;flex-direction:column;gap:6px;font-size:13px}
.gate{display:flex;justify-content:space-between;gap:10px;align-items:center}
.agents{display:flex;flex-wrap:wrap;gap:6px}
.agent{--c:var(--ink3);font:500 11.5px var(--mono);border:1px dashed var(--line);color:var(--ink3);border-radius:6px;padding:4px 8px}

/* ---------- reglas ---------- */
const score=o=>Object.values(o.bant).filter(Boolean).length*25;
const bantN=o=>Object.values(o.bant).filter(Boolean).length;
const bantGate=o=>bantN(o)>=CFG.bantMin&&(!CFG.bantAB||o.bant.A||o.bant.B);
const isClosed=o=>o.stage.startsWith('Cerrada');
const reached=o=>o.stage==='Cerrada-Perdida'?STG[o.lostFrom||'SQL-Prospección'].i:STG[o.stage].i;
function approverFor(d){if(d<=CFG.disc1)return{who:'Comercial',lvl:0};if(d<=CFG.disc2)return{who:'Alejandro',lvl:1};return{who:'Alejandro + revisión de margen',lvl:2}}
const needsApproval=p=>p.discount>CFG.disc1&&!p.approved;
const netOf=p=>p.monto*(1-p.discount/100);
const validUntil=p=>new Date(p.sentAt.getTime()+CFG.vig*DAY);
function cadence(p){
  if(p.estado!=='Enviada')return null;
  const dd=daysBetween(p.sentAt,TODAY);
  if(dd>=CFG.vig)return{dd,lvl:4,cls:'crit',t:`Día ${dd} · decidir cierre (silencio)`};
  if(dd>=CFG.cad3)return{dd,lvl:3,cls:'crit',t:`Día ${dd} · breakup email`};
  if(dd>=CFG.cad2)return{dd,lvl:2,cls:'warn',t:`Día ${dd} · recordatorio + llamada`};
  if(dd>=CFG.cad1)return{dd,lvl:1,cls:'info',t:`Día ${dd} · recordatorio automático`};
  return{dd,lvl:0,cls:'ok',t:`Día ${dd} · en plazo`};
}
const isPaid=i=>!!i.paidAt;
function mora(i){if(isPaid(i)||i.estado==='Borrador')return 0;return Math.max(0,daysBetween(i.dueAt,TODAY))}
function payState(i){if(i.estado==='Borrador')return'Borrador';if(isPaid(i))return'Pagada';return mora(i)>0?'Vencida':'Pendiente'}
function moraLevel(i){const m=mora(i);if(m<=0)return null;if(m<=CFG.mora1)return{cls:'info',t:'Recordatorio neutro'};if(m<=CFG.mora2)return{cls:'warn',t:'Aviso al responsable'};return{cls:'crit',t:'Checkpoint humano'}}
function slaState(o){
  if(o.stage!=='MQL'||o.firstContactAt||!o.mqlAt)return null;
  const h=Math.round((NOW-o.mqlAt)/HOUR);
  if(h>CFG.slaAlert)return{cls:'crit',t:`SLA vencido · ${h} h`,h};
  if(h>CFG.sla)return{cls:'warn',t:`SLA ${CFG.sla} h excedido · ${h} h`,h};
  return{cls:'ok',t:`SLA en plazo · ${h} h`,h};
}
const projCost=p=>sum(gastos.filter(g=>g.projectId===p.id&&g.estado!=='Rechazado'),g=>toPEN(g.monto,g.currency));
function projFlags(p){const f=[];const d=daysBetween(p.lastFollowUp,TODAY);if(d>CFG.riskDays)f.push(`Sin seguimiento hace ${d} días`);if(p.feedbackNeg)f.push('Feedback negativo del cliente');if(invoices.some(i=>i.oppId===p.oppId&&mora(i)>CFG.riskMora))f.push(`Factura vencida +${CFG.riskMora} días`);if(p.scopeReduction)f.push('Reducción de alcance');return f}
function projRisk(p){const n=projFlags(p).length;if(n>=2)return{c:'r',t:'Rojo'};if(n===1||(p.margenReal!=null&&p.margenReal<p.margenEst-6))return{c:'a',t:'Ámbar'};return{c:'g',t:'Verde'}}
const reqApproval=g=>toPEN(g.monto,g.currency)>CFG.gastoUmbral;
function gState(g){if(g.estado==='Registrado'&&reqApproval(g))return'Por aprobar';return g.estado}

function oppAlerts(o){

  invoices.forEach(i=>{const a=acc(i.accountId);

const monthStart=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
const inMonth=d=>d>=monthStart&&d<=NOW;
const gPEN=g=>toPEN(g.monto,g.currency);
const liveG=()=>gastos.filter(g=>g.estado!=='Rechazado');
function adsLast30(){return sum(liveG().filter(g=>g.categoria===GCATS[0]&&daysBetween(g.fecha,TODAY)<=30),gPEN)}
function kpis(){
  const n=opps.length,nM=opps.filter(o=>reached(o)>=1).length,nS=opps.filter(o=>reached(o)>=2).length;
  const won=opps.filter(o=>o.stage==='Cerrada-Ganada'),lost=opps.filter(o=>o.stage==='Cerrada-Perdida');
  const leads30=opps.filter(o=>daysBetween(o.created,TODAY)<=30).length;
  const ads=adsLast30();
  const ciclo=Math.round(avg(won,o=>daysBetween(o.created,o.closedAt)));
  const open=opps.filter(o=>!isClosed(o));
  const pipe=sum(open,o=>toPEN(o.value,o.currency)*prob(o.stage)/100),pipeFull=sum(open,o=>toPEN(o.value,o.currency));
  const fm=invoices.filter(i=>i.estado!=='Borrador'&&inMonth(i.issuedAt));
  const fact=sum(fm,i=>toPEN(i.monto,i.currency));
  const due=invoices.filter(i=>i.estado!=='Borrador'&&i.dueAt<=TODAY);
  const onTime=due.filter(i=>i.paidAt&&sod(i.paidAt)<=sod(i.dueAt)).length;
  const gm=liveG().filter(g=>inMonth(g.fecha)),gmT=sum(gm,gPEN),bud=sum(GCATS,c=>CFG.budget[c]||0);
  const vencido=sum(invoices.filter(i=>mora(i)>0),i=>toPEN(i.monto,i.currency));
  return {
    leads:{l:'Leads · 30 días',v:leads30,f:'Oportunidades creadas'},
    cpl:{l:'CPL',v:fmtS(ads/Math.max(1,leads30)),f:`${fmtS(ads)} en Ads (30 d) ÷ leads`},
    l2m:{l:'Lead → MQL',v:pct(nM,n)+' %',f:`${nM} de ${n} alcanzaron MQL`},
    m2s:{l:'MQL → SQL',v:pct(nS,nM)+' %',f:`${nS} de ${nM} alcanzaron SQL`},
    win:{l:'Tasa de cierre',v:pct(won.length,won.length+lost.length)+' %',f:`${won.length} ganadas · ${lost.length} perdidas`},
    ciclo:{l:'Ciclo de venta',v:ciclo+' d',f:'Promedio Lead → Ganada'},
    pipe:{l:'Pipeline ponderado',v:fmtK(pipe),f:`Bruto ${fmtK(pipeFull)} × probabilidad`},
    fact:{l:'Facturación del mes',v:fmtK(fact),f:`${fm.length} comprobantes en ${MES[TODAY.getMonth()]}`},
    ontime:{l:'Cobrado a tiempo',v:pct(onTime,due.length)+' %',f:`${onTime} de ${due.length} facturas ya vencidas`},
    venc:{l:'Cartera vencida',v:fmtK(vencido),f:`${invoices.filter(i=>mora(i)>0).length} facturas con mora`},
    gastos:{l:'Gastos del mes',v:fmtK(gmT),f:`${pct(gmT,bud)} % del presupuesto (${fmtK(bud)})`},
    nps:{l:'NPS',v:'+58',f:'12 respuestas de clientes activos',sim:1}};
}

/* ---------- gráficos ---------- */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function roundTop(x,y,w,h,r){if(h<=0.5)return'';r=Math.min(r,h,w/2);return`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function vbars(data,{color='var(--accent)',fmt=fmtK,label='Serie',hl=null}={}){
  const W=560,H=210,pl=68,pr=8,pt=20,pb=26;
  const mx=niceMax(Math.max(0,...data.map(d=>d.v))/4)*4;const iw=W-pl-pr,ih=H-pt-pb,step=iw/data.length,bw=Math.min(54,step*0.62);
  const y=v=>pt+ih-(v/mx)*ih;
  const imax=data.reduce((b,d,i)=>d.v>data[b].v?i:b,0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line class="${i?'grid':'base'}" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${esc(fmt(v))}</text>`}
  data.forEach((d,i)=>{const x=pl+step*i+(step-bw)/2,h=ih*(d.v/mx);
    s+=`<g data-tip="${esc(d.l+' · '+fmt(d.v)+(d.sub?' · '+d.sub:''))}"><rect x="${pl+step*i}" y="${pt}" width="${step}" height="${ih}" fill="transparent"/><path d="${roundTop(x,y(d.v),bw,h,4)}" fill="${d.c||color}" opacity="${hl==null||hl===i?1:.55}"/></g>`;
    s+=`<text class="ax" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`;
    if(i===imax||i===data.length-1)s+=`<text class="axv" x="${x+bw/2}" y="${y(d.v)-6}" text-anchor="middle">${esc(fmt(d.v))}</text>`});
  return `<div class="vb">${s}</svg></div>`;
}
function hbar(rows,{color='var(--accent)',fmt=v=>String(v),max}={}){
  if(!rows.length)return'<p class="note">Sin datos para este corte.</p>';
  const mx=max||Math.max(1e-9,...rows.map(r=>Math.max(r.v,r.mk||0)));
  return `<div class="hb">${rows.map(r=>`<div class="hb-row" data-tip="${esc(r.tip||(r.l+' · '+(r.vl??fmt(r.v))))}"><span class="hb-l" title="${esc(r.l)}">${esc(r.l)}</span><span class="hb-t"><b style="width:${r.v>0?Math.max(1.5,r.v/mx*100):0}%;background:${r.c||color}"></b>${r.mk!=null?`<i style="left:calc(${Math.min(100,r.mk/mx*100)}% - 1px)"></i>`:''}</span><span class="hb-v mono">${r.vl??fmt(r.v)}</span></div>`).join('')}</div>`;
}
const panel=(t,sub,body,wide)=>`<section class="panel" ${wide?'style="grid-column:1/-1"':''}><div class="panel-h"><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div>${body}</section>`;
const stats=a=>`<div class="stats">${a.map(s=>`<div class="stat"><div class="lab">${s.l}</div><div class="val" ${s.crit?'style="color:var(--crit)"':''}>${s.v}</div>${s.f?`<div class="foot">${s.f}</div>`:''}</div>`).join('')}</div>`;
const miniTable=(head,rows)=>`<div class="tblwrap"><table class="tbl"><thead><tr>${head.map((h,i)=>`<th ${i?'class="num"':''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td ${i?'class="num"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function groupBy(a,f){const m=new Map();a.forEach(x=>{const k=f(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return m}

/* ---------- Pipeline ---------- */
function matchPipe(o){
  const q=S.q.pipe.trim().toLowerCase();
  if(q){const a=acc(o.accountId),c=con(o.contactId);if(!(a.name+' '+c.name+' '+o.name).toLowerCase().includes(q))return false}
  if(S.f.owner&&o.owner!==S.f.owner)return false;
  if(S.f.cur&&o.currency!==S.f.cur)return false;
  return true;
}
function oppCard(o){
  const a=acc(o.accountId),c=con(o.contactId),sc=score(o),al=oppAlerts(o);
  const late=o.nextStepDate&&daysBetween(o.nextStepDate,TODAY)>0;

function rPipeline(){
  const open=opps.filter(o=>!isClosed(o)),V=o=>toPEN(o.value,o.currency),W=o=>V(o)*prob(o.stage)/100;
  const stale=open.filter(o=>o.nextStepDate&&daysBetween(o.nextStepDate,TODAY)>0).length;
  const months=lastMonths(1,3).slice(0);
  const fc=months.map(m=>({l:m.l,v:sum(open.filter(o=>monthKey(o.closeEst)===m.k),W),sub:`${open.filter(o=>monthKey(o.closeEst)===m.k).length} oportunidades`}));
  const later=sum(open.filter(o=>monthKey(o.closeEst)>months[months.length-1].k),W);
  const byOwner=OWNERS.map(ow=>{const os=opps.filter(o=>o.owner===ow),w=os.filter(o=>o.stage==='Cerrada-Ganada').length,l=os.filter(o=>o.stage==='Cerrada-Perdida').length;return{ow,open:os.filter(o=>!isClosed(o)).length,pond:sum(os.filter(o=>!isClosed(o)),W),w,l}});
  const srcs=[...SOURCES,'Cliente existente'].map(s=>{const os=opps.filter(o=>o.source===s);return{s,n:os.length,m:os.filter(o=>reached(o)>=1).length,q:os.filter(o=>reached(o)>=2).length,w:os.filter(o=>o.stage==='Cerrada-Ganada').length}}).filter(x=>x.n);
  const lossG=groupBy(opps.filter(o=>o.stage==='Cerrada-Perdida'),o=>o.lossReason);
  return stats([
    {l:'Pipeline abierto',v:fmtK(sum(open,V)),f:`${open.length} oportunidades`},
    {l:'Ponderado',v:fmtK(sum(open,W)),f:'Valor × probabilidad de la etapa'},
    {l:'Ticket promedio',v:fmtK(avg(open,V)),f:'Oportunidades abiertas'},
    {l:'Con próximo paso vencido',v:stale,f:`${pct(stale,open.length)} % del pipeline abierto`,crit:stale>0}])+
  `<div class="grid2e">
   ${panel('Forecast ponderado','Por mes de cierre estimado',vbars(fc,{label:'Forecast ponderado por mes'})+`<p class="chart-note">Más allá de ${months[months.length-1].l}: ${fmtK(later)} ponderado.</p>`)}
   ${panel('Pipeline por responsable','Ponderado abierto',hbar(byOwner.map(x=>({l:x.ow,v:x.pond,vl:fmtK(x.pond)})))+miniTable(['Responsable','Abiertas','Ganadas','Perdidas','Tasa de cierre'],byOwner.map(x=>[x.ow,x.open,x.w,x.l,(x.w+x.l?pct(x.w,x.w+x.l)+' %':'—')])))}
   ${panel('Conversión por fuente','% que llegó a SQL',hbar(srcs.map(x=>({l:x.s,v:pct(x.q,x.n),vl:pct(x.q,x.n)+' %',tip:`${x.s} · ${x.q} de ${x.n} llegaron a SQL`})),{max:100})+miniTable(['Fuente','Leads','→ MQL','→ SQL','Ganadas'],srcs.map(x=>[x.s,x.n,x.m,x.q,x.w])))}
   ${panel('Antigüedad por etapa','Días promedio desde la creación',hbar(STAGES.slice(0,5).map(s=>{const os=open.filter(o=>o.stage===s.k);return{l:s.k,v:Math.round(avg(os,o=>daysBetween(o.created,TODAY))),vl:Math.round(avg(os,o=>daysBetween(o.created,TODAY)))+' d',c:`var(--${s.phase})`}})))}

function propActions(p,o){
  if(isClosed(o))return'';
  if(DASH){const c=cadence(p);return needsApproval(p)||(c&&c.lvl===4)?nBtn(p,'propuestas','Decidir en Notion'):''}
  const b=[];
  if(needsApproval(p))b.push(`<button class="btn sm" data-act="approveDisc" data-id="${p.id}">Aprobar ${p.discount} %</button>`);
  if(p.estado==='Borrador')b.push(`<button class="btn sm ghost" data-act="sendProp" data-id="${p.id}">Enviar</button>`);
  const c=cadence(p);if(c&&c.lvl===4)b.push(`<button class="btn sm danger" data-act="silence" data-id="${o.id}">Decidir cierre</button>`);
  return b.join(' ');
}

function rFacturacion(){
  const em=invoices.filter(i=>i.estado!=='Borrador'),P=i=>toPEN(i.monto,i.currency);

  const aging=[['Por vencer',i=>mora(i)===0,'var(--ok)'],[`1–${CFG.mora1} d`,i=>mora(i)>0&&mora(i)<=CFG.mora1,'var(--info)'],[`${CFG.mora1+1}–${CFG.mora2} d`,i=>mora(i)>CFG.mora1&&mora(i)<=CFG.mora2,'var(--warn)'],[`${CFG.mora2+1}+ d`,i=>mora(i)>CFG.mora2,'var(--crit)']];
  const deud=[...groupBy(pend,i=>i.accountId)].map(([a,is])=>({l:acc(a).name,v:sum(is,P)})).sort((a,b)=>b.v-a.v).slice(0,6);
  return stats([{l:'Facturado · 6 meses',v:fmtK(sum(em.filter(i=>ms.some(m=>m.k===monthKey(i.issuedAt))),P))},{l:'Cobrado',v:fmtK(sum(paid,P)),f:`${paid.length} facturas pagadas`},{l:'Por cobrar',v:fmtK(sum(pend,P)),f:`${pend.length} facturas`},{l:'Días promedio de cobro',v:Math.round(dso)+' d',f:'Emisión → pago'}])+
  `<div class="grid2e">
   ${panel('Facturado por mes','Comprobantes emitidos (S/)',vbars(ms.map(m=>({l:m.l,v:sum(em.filter(i=>monthKey(i.issuedAt)===m.k),P),sub:`${em.filter(i=>monthKey(i.issuedAt)===m.k).length} comprobantes`})),{label:'Facturado por mes',color:'var(--venta)'}))}
   ${panel('Antigüedad de la cartera','Saldo pendiente por tramo (S/)',hbar(aging.map(([l,f,c])=>({l,v:sum(pend.filter(f),P),vl:fmtK(sum(pend.filter(f),P)),c,tip:`${l} · ${pend.filter(f).length} facturas`}))))}
   ${panel('Por tipo de cobro','Emitido (S/)',hbar(['Adelanto','Hito','Recurrente'].map(t=>({l:t,v:sum(em.filter(i=>i.tipo===t),P),vl:fmtK(sum(em.filter(i=>i.tipo===t),P))})),{color:'var(--venta)'}))}
   ${panel('Mayores saldos por cobrar','Por cuenta (S/)',hbar(deud.map(d=>({...d,vl:fmtK(d.v)})),{color:'var(--venta)'}))}
  </div>`;
}

/* ---------- Gastos ---------- */
function matchG(g){
  const q=S.q.gas.trim().toLowerCase();
  if(q&&!(g.concepto+' '+g.proveedor).toLowerCase().includes(q))return false;
  if(S.f.gcat&&g.categoria!==S.f.gcat)return false;
  if(S.f.gest&&gState(g)!==S.f.gest)return false;
  if(S.f.gmes&&String(monthKey(g.fecha))!==S.f.gmes)return false;
  if(S.f.gtipo==='dir'&&!g.projectId)return false;
  if(S.f.gtipo==='ovh'&&g.projectId)return false;
  return true;
}
function gActions(g){
  const s=gState(g);
  if(DASH)return s==='Por aprobar'?nBtn(g,'gastos','Decidir en Notion'):'';
  if(s==='Por aprobar')return RO?'':`<button class="btn sm" data-act="approveG" data-id="${g.id}">Aprobar</button> <button class="btn sm ghost" data-act="rejectG" data-id="${g.id}">Rechazar</button> <button class="btn sm ghost" data-act="editG" data-id="${g.id}">Editar</button>`;
  if(RO)return'';
  const ed=`<button class="btn sm ghost" data-act="editG" data-id="${g.id}">Editar</button>`;
  if(s==='Registrado'||s==='Aprobado')return `<button class="btn sm ghost" data-act="payG" data-id="${g.id}">Marcar pagado</button> `+ed;
  if(s==='Rechazado')return `<button class="btn sm ghost" data-act="delG" data-id="${g.id}">Eliminar</button>`;
  return'';
}

  const h=head('Costos propios y directos de proyectos','Gastos',`<div class="headr"><div class="rules"><span class="rule">Aprobación de Alejandro sobre ${fmtS(CFG.gastoUmbral)}</span></div>${W('<button class="btn" data-act="newG">+ Registrar gasto</button>')}</div>`);

  <div class="filters">

  ${list.slice(0,150).map(g=>{const s=gState(g),p=g.projectId?proj(g.projectId):null;return `<tr id="g-${g.id}" ${S.hl===g.id?'style="outline:2px solid var(--accent);outline-offset:-2px"':''}><td class="mono sm nowrap">${fmtD(g.fecha)}</td><td>${esc(g.concepto)}${g.recurrente?' <span class="chip mute">recurrente</span>':''} ${testB(g)}</td><td class="sm">${esc(g.proveedor)}</td><td class="sm">${g.categoria}</td><td class="sm">${p?`<button class="link" data-act="openProj" data-id="${p.id}">${esc(acc(p.accountId).name)}</button>`:'Overhead'}</td><td class="sm">${g.comprobante}</td><td class="num">${fmtMoney(g.monto,g.currency)}</td><td><span class="chip ${G_CLS[s]}">${s}</span>${g.motivo?`<div class="sm">${esc(g.motivo)}</div>`:''}</td><td class="nowrap">${gActions(g)}</td></tr>`}).join('')}

function rGastos(){
  const L=liveG(),ms=lastMonths(6),gm=L.filter(g=>inMonth(g.fecha)),bud=sum(GCATS,c=>CFG.budget[c]||0);
  const dayFrac=TODAY.getDate()/new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate();
  const byCat=GCATS.map(c=>{const v=sum(gm.filter(g=>g.categoria===c),gPEN),b=CFG.budget[c]||0;return{l:c,v,mk:b,vl:`${fmtK(v)} / ${fmtK(b)}`,c:v>b?'var(--crit)':'var(--accent)',tip:`${c} · ${pct(v,b)} % del presupuesto`}});
  const prov=[...groupBy(L.filter(g=>ms.some(m=>m.k===monthKey(g.fecha))),g=>g.proveedor)].map(([p,gs])=>({l:p,v:sum(gs,gPEN)})).sort((a,b)=>b.v-a.v).slice(0,8);
  const cplRows=ms.map(m=>{const ads=sum(L.filter(g=>g.categoria===GCATS[0]&&monthKey(g.fecha)===m.k),gPEN),leads=opps.filter(o=>monthKey(o.created)===m.k).length;return[`${m.l} ${m.d.getFullYear()}`,fmtS(ads),leads,leads?fmtS(ads/leads):'—']});
  const dir=sum(gm.filter(g=>g.projectId),gPEN),ovh=sum(gm.filter(g=>!g.projectId),gPEN);
  const fact=sum(invoices.filter(i=>i.estado!=='Borrador'&&inMonth(i.issuedAt)),i=>toPEN(i.monto,i.currency));
  return stats([{l:'Gasto del mes',v:fmtK(dir+ovh),f:`Día ${TODAY.getDate()}: ${Math.round(dayFrac*100)} % del mes transcurrido`},{l:'Presupuesto usado',v:pct(dir+ovh,bud)+' %',crit:dir+ovh>bud},{l:'Gasto promedio mensual',v:fmtK(avg(ms.slice(0,5),m=>sum(L.filter(g=>monthKey(g.fecha)===m.k),gPEN))),f:'5 meses cerrados'},{l:'Gasto / facturación del mes',v:fact?pct(dir+ovh,fact)+' %':'—',f:`Facturado ${fmtK(fact)}`}])+
  `<div class="grid2e">
   ${panel('Presupuesto por categoría','Mes en curso · barra: gasto · línea: presupuesto',hbar(byCat)+'<p class="chart-note">En rojo, las categorías que ya superaron el presupuesto mensual.</p>',true)}
   ${panel('Gasto total por mes','Sin rechazados (S/)',vbars(ms.map(m=>({l:m.l,v:sum(L.filter(g=>monthKey(g.fecha)===m.k),gPEN)})),{label:'Gasto por mes'}))}
   ${panel('Directo vs overhead','Mes en curso (S/)',hbar([{l:'Directo (proyectos)',v:dir,vl:fmtK(dir),c:'var(--proy)'},{l:'Overhead',v:ovh,vl:fmtK(ovh)}])+`<p class="chart-note">Directo = freelancers y proveedores imputados a un proyecto.</p>`)}
   ${panel('Principales proveedores','Últimos 6 meses (S/)',hbar(prov.map(p=>({...p,vl:fmtK(p.v)}))))}
   ${panel('CPL por mes','Inversión en Ads propia ÷ leads creados',miniTable(['Mes','Inversión Ads','Leads','CPL'],cplRows)+'<p class="chart-note">Los meses antiguos tienen pocos leads porque el set de prueba solo trae oportunidades recientes.</p>')}
  </div>`;
}

function tryMove(o,to){
  if(o.stage===to)return render();
  if(isClosed(o)){showModal({eyebrow:'Regla',title:'Esta oportunidad ya está cerrada',html:'<p>Una oportunidad cerrada no se reabre. Para un nuevo servicio crea otra oportunidad con fuente “Cliente existente” (Recompra).</p>',ok:null,cancel:'Entendido'});return}
  const ti=STG[to].i;
  if(to==='Cerrada-Perdida')return lossModal(o);
  if(ti>=1&&score(o)<CFG.mql){showModal({eyebrow:'Regla · umbral MQL',title:`No puede pasar a ${to}`,html:`<p>El score es <b class="mono">${score(o)} pts</b>. El paso a MQL exige <b>≥ ${CFG.mql} pts</b>.</p><p class="note">Confirma más criterios BANT en la ficha y vuelve a intentarlo.</p>`,ok:'Ir a BANT',onOk:()=>{openDrawer('opp',o.id);return true}});return}
  if(ti>=3&&ti<=5&&!bantGate(o)){showModal({eyebrow:'Regla · BANT',title:`No puede pasar a ${to}`,html:`<p>Para cotización formal se requieren <b>${CFG.bantMin} de 4</b> criterios confirmados${CFG.bantAB?', incluyendo <b>B · Presupuesto</b> o <b>A · Decisor</b>':''}.</p><p>Estado actual: <span class="mono">${bantN(o)}/4</span> · B ${o.bant.B?'✓':'✗'} · A ${o.bant.A?'✓':'✗'}</p>`,ok:'Ir a BANT',onOk:()=>{openDrawer('opp',o.id);return true}});return}
  if(to==='Cerrada-Ganada')return wonModal(o);
  const from=o.stage;o.stage=to;
  if(ti>=1&&!o.mqlAt)o.mqlAt=new Date();
  o.nextStep=(NEXT[to]||[''])[0];o.nextStepDate=dOff(3);
  if(ti>=2)con(o.contactId).estado='En conversación';
  const AG={'Lead':['Maduración · Alta a nurturing','agregó el contacto a la secuencia de nurturing'],'MQL':['Maduración · Scoring',`confirmó score ≥ ${CFG.mql} y activó el SLA de ${CFG.sla} h`],'SQL-Prospección':['Seguimiento · Post-reunión','preparará el acta del discovery y los próximos pasos'],'SQL-Cotización':['Seguimiento · Cotización sin respuesta',`programó la cadencia día ${CFG.cad1} / ${CFG.cad2} / ${CFG.cad3} / ${CFG.vig}`],'SQL-Negociación':['Seguimiento · Post-reunión','registrará el acta de negociación y las tareas']}[to];
  o.log.push({t:new Date(),ag:'',x:`Movida de ${from} a ${to}`});
  if(AG)pushFeed(AG[0],`${AG[1]} · ${acc(o.accountId).name}`,o.id);
  save('opps',o);save('contacts',con(o.contactId));
  toast(`${acc(o.accountId).name} → ${to}`);render();
}
function lossModal(o,preset){

   onOk:()=>{const v=document.querySelector('input[name=loss]:checked');if(!v){$('#m-err').textContent='Selecciona un motivo de la lista.';return false}
     const from=o.stage;o.lostFrom=from.startsWith('SQL')?from:'SQL-Prospección';o.stage='Cerrada-Perdida';o.lossReason=v.value;o.closedAt=new Date();
     const p=latestProp(o);if(p&&['Enviada','Vigente','Borrador'].includes(p.estado))p.estado=v.value==='Silencio'?'Vencida':'Rechazada';
     con(o.contactId).estado='Inactivo';
     o.log.push({t:new Date(),ag:'',x:`Cerrada-Perdida · ${v.value} (decisión humana)`});pushFeed('Maduración · Alta a nurturing',`devolverá a ${con(o.contactId).name} a nurturing trimestral tras la pérdida (${v.value})`,o.id);

function wonModal(o){
  const p=latestProp(o);

function onWriteErr(e){

function persistRaw(path,body){

  COLS.forEach(col=>{DB.collection(col).limit(1000).onSnapshot(snap=>{
    const items=snap.docs.map(d=>{const o=revive(d.data()||{});o.id=o.id||d.id;return o});
    const a=ARR[col];a.length=0;a.push(...items);loaded.add(col);schedule()},e=>subErr(col,e))});

  DB.doc('activity/log').onSnapshot(sn=>{const ev=sn.exists?(sn.data().events||[]):[];feedUser.length=0;ev.forEach(x=>feedUser.push({user:true,...revive(x)}));loaded.add('activity');schedule()},e=>subErr('activity',e));

/* ---------- navegación y render ---------- */
function openDrawer(type,id){S.drawer={type,id};renderDrawer()}
function syncHash(){try{history.replaceState(null,'','#'+S.view+(tabOf(S.view)==='rep'?'-reporte':''))}catch(e){}}
function setView(v){S.view=v;S.drawer=null;syncHash();render();window.scrollTo(0,0)}
function render(){
  const ae=document.activeElement,aid=ae&&ae.id,sel=ae&&typeof ae.selectionStart==='number'?ae.selectionStart:null;
  const gOpen=!!document.querySelector('.main details.np[open]');
  $('#nav').innerHTML=navHTML();
  $('#main').innerHTML=isLoading()?`<section class="panel"><h2>Cargando la base compartida…</h2><p class="note">Leyendo cuentas, oportunidades, facturas y gastos.</p></section>`:VIEWFN[S.view]();
  updSave();
  if(gOpen){const d=document.querySelector('.main details.np');if(d)d.open=true}
  if(!isLoading())renderDrawer();
  if(aid){const el=document.getElementById(aid);if(el&&el!==document.activeElement){el.focus();if(sel!=null&&el.setSelectionRange)try{el.setSelectionRange(sel,sel)}catch(e){}}}
}
function focusRow(id){setTimeout(()=>{const r=document.getElementById(id);if(r)r.scrollIntoView({block:'center'})},30)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=t.dataset.id;
  if((RO||(DASH&&act!=='resetCfg'))&&!NON_MUT.has(act)){toast('Los datos se editan en Notion; aquí son solo lectura.');return}
  if(FORMS[act]){FORMS[act](id);return}
  switch(act){
    case 'nav':setView(id);break;
    case 'tab':S.tab[S.view]=id;syncHash();render();break;
    case 'openOpp':openDrawer('opp',id);break;
    case 'openAcc':openDrawer('acc',id);break;
    case 'openProj':openDrawer('proj',id);break;
    case 'closeDrawer':S.drawer=null;renderDrawer();break;
    case 'mCancel':closeModal();break;
    case 'mOk':{const keep=modalCb?modalCb()===false:false;if(!keep)closeModal();break}
    case 'goInv':S.hl=id;S.f.inv='';S.tab.facturacion='op';setView('facturacion');focusRow('inv-'+id);break;
    case 'goGasto':S.hl=id;Object.assign(S.f,{gcat:'',gest:'',gmes:'',gtipo:''});S.q.gas='';S.tab.gastos='op';setView('gastos');focusRow('g-'+id);break;
    case 'approveDisc':{const p=proposals.find(x=>x.id===id),o=opp(p.oppId),ap=approverFor(p.discount);
      showModal({title:`Aprobar descuento de ${p.discount} %`,html:`<p>${esc(acc(o.accountId).name)} · v${p.version} · neto ${fmtMoney(netOf(p),p.currency)} (lista ${fmtMoney(p.monto,p.currency)}).</p><p>Rango ${ap.lvl===1?`${CFG.disc1+1}–${CFG.disc2} %`:`&gt; ${CFG.disc2} %`} → aprueba <b>${ap.who}</b>.</p>${ap.lvl===2?`<div class="opts"><label><input type="checkbox" id="m-margin"> Revisé el margen: el proyecto sigue sobre el mínimo acordado</label></div>`:''}`,ok:'Aprobar',
        onOk:()=>{if(ap.lvl===2&&!$('#m-margin').checked){$('#m-err').textContent=`Confirma la revisión de margen para aprobar un descuento mayor a ${CFG.disc2} %.`;return false}p.approved=true;o.log.push({t:new Date(),ag:'',x:`Descuento ${p.discount} % aprobado por ${ap.who}`});save('proposals',p);save('opps',o);toast('Descuento aprobado');return true}});break}
    case 'sendProp':{const p=proposals.find(x=>x.id===id),o=opp(p.oppId);
      if(needsApproval(p)){showModal({eyebrow:'Regla · descuentos',title:'Falta aprobar el descuento',html:`<p>Un descuento de ${p.discount} % lo aprueba <b>${approverFor(p.discount).who}</b>. Apruébalo antes de enviar.</p>`,ok:null,cancel:'Entendido'});break}
      if(!bantGate(o)){showModal({eyebrow:'Regla · BANT',title:'Aún no califica para cotización formal',html:`<p>Se requieren ${CFG.bantMin} de 4 criterios BANT${CFG.bantAB?', incluyendo Presupuesto o Decisor':''}.</p>`,ok:null,cancel:'Entendido'});break}
      proposals.filter(x=>x.oppId===o.id&&x!==p&&(x.estado==='Enviada'||x.estado==='Vigente')).forEach(x=>x.estado='Vencida');
      p.estado='Enviada';p.sentAt=TODAY;
      if(STG[o.stage].i<3){o.stage='SQL-Cotización';o.nextStep='Seguimiento a cotización enviada';o.nextStepDate=dOff(CFG.cad1)}
      o.log.push({t:new Date(),ag:'',x:`Propuesta v${p.version} enviada`});pushFeed('Seguimiento · Cotización sin respuesta',`programó recordatorios día ${CFG.cad1}, ${CFG.cad2} y ${CFG.cad3} para la v${p.version} de ${acc(o.accountId).name}`,o.id);proposals.filter(x=>x.oppId===o.id).forEach(x=>save('proposals',x));save('opps',o);toast(`v${p.version} enviada · vigente hasta ${fmtD(validUntil(p))}`);render();break}
    case 'createProp':{const o=opp(id),m=parseFloat($('#np-monto').value),d=Math.max(0,parseFloat($('#np-disc').value)||0),al=$('#np-alc').value.trim();
      if(!(m>0)){toast('Ingresa un monto mayor a 0');break}
      const v=(latestProp(o)?.version||0)+1;
      const np={id:uid('P'),oppId:o.id,version:v,alcance:al||o.services.join(' + '),monto:m,currency:o.currency,discount:d,approved:false,estado:'Borrador',sentAt:TODAY,condiciones:latestProp(o)?.condiciones||'50 % adelanto / 50 % contra entrega',test:false};
      proposals.push(np);
      o.log.push({t:new Date(),ag:'',x:`Borrador v${v} creado · descuento ${d} %`});save('proposals',np);save('opps',o);toast(`Borrador v${v} creado`+(d>CFG.disc1?` · requiere aprobación de ${approverFor(d).who}`:''));render();break}
    case 'silence':lossModal(opp(id),'Silencio');break;
    case 'firstContact':{const o=opp(id);o.firstContactAt=new Date();con(o.contactId).estado='En conversación';o.log.push({t:new Date(),ag:'',x:'Primer contacto registrado'});save('opps',o);save('contacts',con(o.contactId));toast('Primer contacto registrado');render();break}
    case 'validateInv':{const i=invoices.find(x=>x.id===id);showModal({title:`Validar ${i.numero}`,html:`<p>${esc(acc(i.accountId).name)} · ${i.tipo} · <b>${fmtMoney(i.monto,i.currency)}</b></p><p>Revisa RUC, monto y condiciones antes de emitir. En el prototipo no se envía nada.</p>`,ok:'Validar y emitir',onOk:()=>{i.estado='Emitida';i.issuedAt=TODAY;i.dueAt=dOff(7);pushFeed('Facturación · Inicial',`emitió ${i.numero} tras validación humana`,i.oppId);save('invoices',i);if(opp(i.oppId))save('opps',opp(i.oppId));toast('Factura emitida');return true}});break}
    case 'payInv':{const i=invoices.find(x=>x.id===id);i.paidAt=new Date();i.estado='Pagada';pushFeed('Facturación · Recurrente',`registró el pago de ${i.numero} (${acc(i.accountId).name})`,i.oppId);save('invoices',i);if(opp(i.oppId))save('opps',opp(i.oppId));toast('Pago registrado');render();break}
    case 'moraCp':{const i=invoices.find(x=>x.id===id);const OPTS=['Llamada del responsable de cuenta','Acordar cronograma de pago','Pausar servicios hasta regularizar','Derivar a cobranza externa'];
      showModal({title:`Cobranza · ${mora(i)} días de mora`,html:`<p>${esc(acc(i.accountId).name)} · ${i.numero} · ${fmtMoney(i.monto,i.currency)}</p><p>Desde el día ${CFG.mora2+1} el agente se detiene y la decisión es humana.</p><div class="opts">${OPTS.map(o=>`<label><input type="radio" name="cp" value="${o}"> ${o}</label>`).join('')}</div>`,ok:'Registrar decisión',
        onOk:()=>{const v=document.querySelector('input[name=cp]:checked');if(!v){$('#m-err').textContent='Elige una acción.';return false}i.decision=v.value;save('invoices',i);addAct({t:new Date(),ag:'Checkpoint de cobranza',x:`${v.value} · ${i.numero}`,user:true});toast('Decisión registrada');return true}});break}
    case 'followUp':{const p=proj(id);p.lastFollowUp=TODAY;save('projects',p);addAct({t:new Date(),ag:'Seguimiento de proyecto',x:`registró seguimiento con ${acc(p.accountId).name}`,user:true});toast('Seguimiento registrado');render();break}
    case 'approveG':{const g=gastos.find(x=>x.id===id);showModal({title:`Aprobar gasto de ${fmtMoney(g.monto,g.currency)}`,html:`<p>${esc(g.concepto)} · ${esc(g.proveedor)}</p><p>${g.categoria} · ${g.projectId?'imputado a '+esc(proj(g.projectId).name):'overhead'}.</p><p class="note">Supera el umbral de ${fmtS(CFG.gastoUmbral)}: lo aprueba Alejandro.</p>`,ok:'Aprobar',onOk:()=>{g.estado='Aprobado';save('gastos',g);toast('Gasto aprobado');return true}});break}
    case 'rejectG':{const g=gastos.find(x=>x.id===id);const OPTS=['Sin presupuesto disponible','Fuera de la política de gastos','Registro duplicado','Falta comprobante válido'];
      showModal({title:'Rechazar gasto',html:`<p>${esc(g.concepto)} · ${fmtMoney(g.monto,g.currency)}</p><div class="opts">${OPTS.map(o=>`<label><input type="radio" name="gr" value="${o}"> ${o}</label>`).join('')}</div>`,ok:'Rechazar',danger:true,onOk:()=>{const v=document.querySelector('input[name=gr]:checked');if(!v){$('#m-err').textContent='Elige un motivo.';return false}g.estado='Rechazado';g.motivo=v.value;save('gastos',g);toast('Gasto rechazado');return true}});break}
    case 'payG':{const g=gastos.find(x=>x.id===id);g.estado='Pagado';save('gastos',g);toast('Gasto marcado como pagado');render();break}
    case 'resetCfg':showModal({eyebrow:'Configuración',title:'Restablecer valores por defecto',html:'<p>Vuelven los umbrales del Blueprint, las probabilidades por etapa, los presupuestos y todos los agentes encendidos.</p>',ok:'Restablecer',onOk:()=>{CFG=JSON.parse(JSON.stringify(CFG_DEFAULT));AGENTS.forEach(a=>CFG.agents[a.k]=true);saveCfg();toast('Configuración restablecida');return true}});break;
  }
});
function validateCfg(){
  if(CFG.disc1>=CFG.disc2)return'El límite del comercial debe ser menor que el de Alejandro.';
  if(CFG.mora1>=CFG.mora2)return'El fin del recordatorio debe ser menor que el fin del aviso.';
  if(!(CFG.cad1<CFG.cad2&&CFG.cad2<CFG.cad3&&CFG.cad3<CFG.vig))return'Los recordatorios deben ir en orden y antes del vencimiento.';
  if(CFG.sla>=CFG.slaAlert)return'La alerta crítica debe ser mayor que el SLA.';
  return null;
}
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.q!==undefined){S.q[t.dataset.q]=t.value;render()}
  if(t.id==='np-disc'){const el=$('#np-appr');if(el)el.innerHTML=apprLine(Math.max(0,parseFloat(t.value)||0))}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.f!==undefined){S.f[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;render();return}
  if(t.id==='fm-accountId'&&document.getElementById('fm-contactId')){$('#fm-contactId').innerHTML=conOpts(t.value).map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');return}
  if(DASH&&(t.dataset.bant||t.id==='stage-sel'||t.dataset.task)){render();return}
  if(RO&&(t.dataset.bant||t.id==='stage-sel'||t.dataset.cfg||t.dataset.cfgb||t.dataset.agent||t.dataset.task)){toast('Tu acceso es de solo lectura.');render();return}
  if(t.dataset.task){const k=tasks.find(x=>x.id===t.dataset.task);if(k){k.estado=t.value;save('tasks',k);toast('Tarea actualizada');render()}return}
  if(t.dataset.bant){const o=opp(t.dataset.id);o.bant[t.dataset.bant]=t.checked;o.log.push({t:new Date(),ag:agOn('Maduración · Scoring')?'Maduración · Scoring':'',x:`Score recalculado: ${score(o)} pts (${t.dataset.bant} ${t.checked?'confirmado':'desmarcado'})`});save('opps',o);render();return}
  if(t.id==='stage-sel'){tryMove(opp(t.dataset.id),t.value);return}
  if(t.dataset.cfg){const path=t.dataset.cfg.split('.'),v=parseFloat(t.value);
    const obj=path.slice(0,-1).reduce((o,k)=>o[k],CFG),k=path[path.length-1],old=obj[k];
    if(!isFinite(v)||v<parseFloat(t.min)||v>parseFloat(t.max)){toast(`Valor fuera de rango (${t.min}–${t.max})`);render();return}
    obj[k]=v;const err=validateCfg();if(err){obj[k]=old;toast(err);render();return}
    saveCfg();toast('Configuración guardada');render();return}
  if(t.dataset.cfgs){if(RO){toast('Tu acceso es de solo lectura.');render();return}const [a,k]=t.dataset.cfgs.split('.'),v=t.value.trim();if(v&&!/^https:\/\/[^\s]+$/.test(v)){toast('Pega un enlace completo que empiece con https://');render();return}CFG[a][k]=v;saveCfg();toast('Enlace guardado');render();return}
  if(t.dataset.cfgb){CFG[t.dataset.cfgb]=t.checked;saveCfg();toast('Configuración guardada');render();return}
  if(t.dataset.agent){CFG.agents[t.dataset.agent]=t.checked;saveCfg();toast(`${t.dataset.agent} ${t.checked?'encendido':'apagado'}`);render();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modalRoot').innerHTML)closeModal();else if(S.drawer){S.drawer=null;renderDrawer()}}
  if(e.key==='Enter'&&e.target.matches('.card[data-act]'))e.target.click();
});
/* drag & drop */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card[draggable]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';c.classList.add('dragging')});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col)return;e.preventDefault();col.classList.remove('over');const o=opp(e.dataTransfer.getData('text/plain'));if(o)tryMove(o,col.dataset.stage)});
/* tooltip */
const tipEl=$('#tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tipEl.hidden=true;return}tipEl.textContent=t.getAttribute('data-tip');tipEl.hidden=false;const w=tipEl.offsetWidth;tipEl.style.left=Math.min(e.clientX+14,innerWidth-w-8)+'px';tipEl.style.top=(e.clientY+16)+'px'});
document.addEventListener('scroll',()=>{tipEl.hidden=true},true);

boot();
</script>

</body></html>
